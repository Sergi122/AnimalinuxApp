[project]
name = "animalinux"
version = "0.5.5"
description = "Mascotas animadas en el escritorio (Hyprland/Wayland y GNOME/Cinnamon/MATE/Xfce/X11), estilo AnimaEngine"
requires-python = ">=3.10"
dependencies = ["Pillow", "numpy", "python-xlib; sys_platform != 'win32'"]

[project.scripts]
animalinux = "animalinux.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
animalinux = ["ui/assets/*.png"]

[tool.setuptools.packages.find]
where = ["."]
include = ["animalinux*"]
